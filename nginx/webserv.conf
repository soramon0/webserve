# webserv.conf — maps to every scenario on the showcase site
# Adjust directive names/syntax to match your own config parser.
http {

server {
    listen 8080;
    client_max_body_size 10Mib;          # 10M, tests the 413 button (which sends 50MB)

    error_page 404 /errors/404.html;
    error_page 403 /errors/403.html;
    error_page 405 /errors/405.html;
    error_page 413 /errors/413.html;
    error_page 500 /errors/500.html;

    # 1. Static site root
    location / {
        root ./nginx/www;
        index index.html;
        methods GET;
    }

    # 2. Autoindex ON — no index file here, forces directory listing
    location /upload/ {
        root ./nginx/www;
        methods GET POST DELETE;
        autoindex on;
        upload_store ./uploads;
        cgi_pass .py /usr/bin/python3;
    }

    # 2b. Autoindex OFF — should 403 since there's no index.html either
    location /protected/ {
        root ./nginx/www;
        methods GET;
        autoindex off;
    }

    # 3. Redirection
    location /old-page {
        return 301 /new-page;
    }

    location /new-page {
        root ./nginx/www;
        index index.html;
        methods GET;
    }

    # 4. Method restriction -> 405 on anything but GET
    location /get-only/ {
        root ./nginx/www;
        index index.html;
        methods GET;
    }

    # 7. CGI
    location /cgi-bin/ {
        root ./nginx/www/cgi-bin;
        methods GET POST;
        cgi_pass .py /usr/bin/python3;
    }
    location /hello.py {
        root ./nginx/www/cgi-bin;
        methods GET POST;
        cgi_pass .py /usr/bin/python3;
    }
}

# Optional: a second server block to prove virtual-host / multi-port support
server {
    listen 8081;

    location / {
        root ./nginx/www;
        index index.html;
        methods GET;
    }
}

}