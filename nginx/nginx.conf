# Full demo / evaluation config for webserv.
# Run from repo root:  ./webserv nginx/nginx.conf
#
# Hosts & ports:
#   127.0.0.1:8080  — static site (nginx/www)
#   127.0.0.1:8081  — dynamic site: CGI, upload, DELETE, body limit (var/www)
#   127.0.0.1:8082  — media / autoindex demo (var/www/website3)

events {}

http {
    client_max_body_size 1mib;

    types {
        text/html                   html htm;
        text/css                    css;
        application/javascript      js;
        image/jpeg                  jpg jpeg;
        image/png                   png;
        video/mp4                   mp4;
        text/plain                  txt;
    }

    # ------------------------------------------------------------------
    # Site A — static website on 127.0.0.1:8080
    # ------------------------------------------------------------------
    server {
        listen 127.0.0.1:8080;

        root ./nginx/www;
        index index.html index.htm;
        error_page 404 error_pages/404.html;
        client_max_body_size 100kib;

        # Default static site: GET only, index file, no listing
        location / {
            methods GET;
            index index.html index.htm;
            autoindex off;
        }

        # Directory listing ON (no usable index → listing of nginx/www)
        location /images/ {
            methods GET;
            autoindex on;
        }

        # HTTP redirection
        location /old {
            methods GET;
            return 301 /hello.html;
        }

        # Method restriction demo: POST here must be 405
        location /hello.html {
            methods GET;
        }
    }

    # ------------------------------------------------------------------
    # Site B — CGI / upload / DELETE on 127.0.0.1:8081
    # ------------------------------------------------------------------
    server {
        listen 127.0.0.1:8081;

        root ./var/www;
        index index.html;
        error_page 404 error_pages/404.html;
        client_max_body_size 1mib;

        location / {
            methods GET;
            index index.html;
            autoindex off;
        }

        # Directory listing ON
        location /listing/ {
            methods GET;
            autoindex on;
            index invalid;
        }

        # Directory listing OFF (no index → forbid / not found, not a listing)
        location /nolist/ {
            methods GET;
            autoindex off;
            index invalid;
        }

        # File uploads (POST) → ./var/www/uploads/<name>
        location /upload {
            methods POST GET;
            root ./var/www;
            upload_store uploads;
            client_max_body_size 100kib;
            autoindex on;
            index index.html;
        }

        # DELETE allowed only under /upload/
        location /upload/ {
            methods DELETE GET POST;
            root ./var/www;
            upload_store uploads;
            client_max_body_size 100kib;
            autoindex on;
        }

        # Oversized-body demo: tiny limit → expect 413
        location /small-body {
            methods POST;
            upload_store uploads;
            client_max_body_size 10b;
        }

        # Redirect on this host
        location /redir {
            methods GET;
            return 302 /;
        }

        # CGI (Python / shell); bonus: add php-cgi if installed
        location /cgi-bin {
            methods GET POST;
            root ./var/www/cgi-bin;
            index query.py;
            autoindex on;
            cgi_pass .py /usr/bin/python3;
            cgi_pass .sh /bin/bash;
            client_max_body_size 1mib;
        }

        location /cgi-bin/session {
            methods GET POST;
            root ./var/www/cgi-bin/session;
            index session_login.html;
            autoindex off;
            cgi_pass .py /usr/bin/python3;
        }
    }

    # ------------------------------------------------------------------
    # Site C — large media / alternate root on 127.0.0.1:8082
    # ------------------------------------------------------------------
    server {
        listen 127.0.0.1:8082;

        root ./var/www/website3;
        index test_website.py;
        client_max_body_size 50mib;

        location / {
            methods GET POST;
            root ./var/www/website3;
            index test_website.py;
            cgi_pass .py /usr/bin/python3;
            autoindex off;
        }

        location /video {
            methods GET;
            root ./var/www/website3;
            index video.mp4;
            autoindex on;
        }

        location /dire {
            methods GET;
            root ./var/www;
            index invalid;
            autoindex on;
        }
    }
}
